# GitHub repository settings: the "About" panel.
#
# This file is the recorded source of truth. GitHub itself does not read
# it: apply changes by hand (repository page, gear icon next to "About").
# The keys follow the Settings App format
# (https://github.com/repository-settings/app), so installing that app
# later syncs this file on every push to the default branch without any
# migration.

repository:
  # At most 350 characters. Mirrors the README tagline.
  description: >-
    Unofficial fork of AprilRobotics/apriltag-imgs that adds SVG versions of
    every tag and AI agent instructions and skills to the pre-generated
    AprilTag 3 tag images.

  # Project website; empty when there is none.
  homepage: ""

  # Comma-separated, at most 20. Each topic: lowercase letters, digits,
  # and hyphens, starting with a letter or digit, at most 50 characters.
  topics: >-
    apriltag, fiducial-markers, computer-vision, robotics, svg, agent-skills,
    claude-code

  # This repository is not a template for others to copy.
  is_template: false

# "Include in the home page" toggles. The Settings App cannot manage
# these; set them by hand. Recorded here so the intended state is known.
#   Releases:    shown
#   Deployments: hidden
#   Packages:    shown
